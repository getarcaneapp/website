name: Build and Deploy Preview

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

jobs:
  build-and-deploy-preview:
    if: ${{ github.event.pull_request.head.repo.owner.login == 'getarcaneapp' && github.actor != 'arcane-github-automation[bot]' }}
    runs-on: depot-ubuntu-latest
    environment:
      name: ${{ github.event.pull_request.user.login }}-pr-${{ github.event.pull_request.number }}
      url: ${{ env.PREVIEW_BASE }}
    env:
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
      PREVIEW_BASE: https://pr-${{ github.event.pull_request.number }}-arcane.ofkm.workers.dev
    steps:
      - name: Request App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: website
          permission-pull-requests: write

      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754
        with:
          node-version: latest
          cache: true
          run-install: false

      - name: Install dependencies
        shell: bash
        run: |
          [[ -f ~/.profile ]] && source ~/.profile
          [[ -f ~/.bashrc ]] && source ~/.bashrc
          vp install

      - name: Generate content data
        run: vp run velite

      - name: Build site
        run: vp build

      - name: Upload and Deploy Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          vp exec wrangler versions upload --preview-alias "$PREVIEW_ALIAS"

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'arcane-github-automation[bot]'
          body-includes: Preview deployed successfully!

      - name: Comment preview URL
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          token: ${{ steps.app-token.outputs.token }}
          body: |
            Preview deployed successfully!

            - Preview: ${{ env.PREVIEW_BASE }}

            Built from commit ${{ github.sha }}
          edit-mode: replace
