name: Deploy Production Website

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ github.repository_owner == 'getarcaneapp' && github.actor != 'arcane-github-automation[bot]' }}
    runs-on: depot-ubuntu-latest
    environment:
      name: production
      url: https://getarcane.app

    steps:
      - name: Checkout arcane website repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: latest
          cache: true
          run-install: false

      - name: Install dependencies
        shell: bash
        run: |
          [[ -f ~/.profile ]] && source ~/.profile
          [[ -f ~/.bashrc ]] && source ~/.bashrc
          vp install

      - name: Build site
        run: vp run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp exec wrangler deploy
