  esbuild: true
  sharp: true
  workerd: true

overrides:
  '@sveltejs/kit': '^3.0.0-next.27'
  cookie: '^1.1.1'
  devalue: '^5.6.2'
  undici: '^7.18.2'
  rollup: '>=4.59.0'
  ws: '>=8.21.0'
  sharp: '0.34.5'
  vite@*: 'catalog:'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
