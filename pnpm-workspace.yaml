autoDedupe: true

update:
  githubActions: true

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  undici: '^7.18.2'
  rollup: '>=4.59.0'
  ws: '>=8.21.0'
  sharp: '0.34.5'
  vite@*: 'catalog:'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
