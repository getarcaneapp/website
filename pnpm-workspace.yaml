autoDedupe: true

lockfile:
  includeResolutionSettings: true

update:
  githubActions: true

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  undici: "^7.18.2"
  rollup: ">=4.59.0"
  ws: ">=8.21.0"
  sharp: "0.34.5"
  vite@*: "catalog:"

packageExtensions:
  # astro2tsx was built against emnapi 1.x but omits its runtime dependency.
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": "1.11.3"

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.5"
  - "@biomejs/cli-android-arm64@2.6.5"
  - "@biomejs/cli-android-x64@2.6.5"
  - "@biomejs/cli-darwin-arm64@2.6.5"
  - "@biomejs/cli-darwin-x64@2.6.5"
  - "@biomejs/cli-linux-arm64-musl@2.6.5"
  - "@biomejs/cli-linux-arm64@2.6.5"
  - "@biomejs/cli-linux-x64-musl@2.6.5"
  - "@biomejs/cli-linux-x64@2.6.5"
  - "@biomejs/cli-win32-arm64@2.6.5"
  - "@biomejs/cli-win32-x64@2.6.5"
